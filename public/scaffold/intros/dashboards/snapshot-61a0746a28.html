<header class="header">
  <div class="logo">M</div>
  <div>
    <div class="brand">Monique</div>
    <div class="role-label">For Mom and Dad · The Money, Straight</div>
  </div>
</header>

<div id="app" class="container">
  <div class="loading">Loading the numbers.</div>
</div>

<script>
  var DATA_URL = './snapshot-61a0746a28-data.json';

  function money(n) {
    if (n === null || n === undefined) return '';
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  function moneyExact(n) {
    if (n === null || n === undefined) return '';
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function compact(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(D) {
    var app = document.getElementById('app');
    var h = '';

    /* HERO */
    var s = D.snapshot;
    h += '<section class="hero">';
    h += '<div class="eyebrow-top">' + esc(s.eyebrowTop) + '</div>';
    h += '<h1>' + s.heroHeadline + '</h1>';
    h += '<p class="hero-sub">' + esc(s.heroSub) + '</p>';
    h += '<div class="personal-note"><p>' + esc(s.openingNote) + '</p></div>';
    h += '</section>';

    /* CLOSINGS LEDGER */
    var c = D.closings;
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">' + esc(c.eyebrow) + '</div><h2>' + esc(c.title) + '</h2><p class="section-lede">' + esc(c.subtitle) + '</p></div>';
    var subLine = c.confirmedCount + ' closings, each matched to a signed disclosure and a deposit.'
      + (c.pendingCount > 0 ? ' ' + c.pendingCount + ' more just closed and landing now.' : '');
    h += '<div class="bignum-card"><div class="bignum-label">Commission closed · ' + esc(c.windowLabel) + '</div><div class="bignum-value">' + moneyExact(c.confirmedTotal) + '</div><div class="bignum-sub">' + subLine + '</div></div>';

    h += '<div class="rows">';
    c.deals.forEach(function (d) {
      var pend = d.status === 'pending';
      var badge = pend ? '<span class="deal-badge pending">Just closed</span>'
        : (d.side === 'Buyer' ? '<span class="deal-badge buyer">Buyer</span>' : '<span class="deal-badge seller">Seller</span>');
      var addr = d.address ? '<span class="deal-addr">' + esc(d.address) + '</span>' : '';
      var val = (d.commission === null)
        ? '<div class="row-value pending">confirming</div>'
        : '<div class="row-value">' + money(d.commission) + '</div>';
      h += '<div class="row"><div class="row-label">' + esc(d.client) + badge + addr + '</div>' + val + '</div>';
    });
    if (c.decLandDeal) {
      var dl = c.decLandDeal;
      h += '<div class="row"><div class="row-label">' + esc(dl.label) + '<span class="deal-addr">' + esc(dl.note) + '</span></div><div class="row-value pending">confirming</div></div>';
    }
    h += '</div>';

    h += '<div class="proof-note"><strong>' + esc(c.depositProof.label) + '.</strong> ' + esc(c.depositProof.text) + '</div>';
    h += '</section>';

    /* LIVE PIPELINE */
    var lv = D.live;
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">' + esc(lv.eyebrow) + '</div><h2>' + esc(lv.title) + '</h2><p class="section-lede">' + esc(lv.subtitle) + '</p></div>';
    h += '<div class="rows">';
    lv.activeListings.forEach(function (al) {
      h += '<div class="row"><div class="row-label">' + esc(al.address) + '<span class="deal-addr">' + esc(al.detail || 'MAMS listing') + '</span></div><div class="row-value"><span class="deal-badge seller">' + esc(al.status) + '</span></div></div>';
    });
    lv.underContract.forEach(function (uc) {
      h += '<div class="row"><div class="row-label">' + esc(uc.label) + '<span class="deal-addr">' + esc(uc.detail) + '</span></div><div class="row-value"><span class="deal-badge buyer">Under contract</span></div></div>';
    });
    h += '</div>';
    h += '<p class="kicker">' + esc(lv.momentum) + '</p>';
    h += '<div class="pair">';
    h += '<div class="pair-card"><div class="pair-tag ag">AG pipeline ahead</div><div class="pair-value">' + money(D.pipeline.ag.weighted) + (D.pipeline.ag.asterisk ? '<span style="color:#D4AF37;font-weight:700">*</span>' : '') + '</div><div class="pair-sub">' + D.pipeline.ag.deals + ' deals, weighted</div></div>';
    h += '<div class="pair-card"><div class="pair-tag mams">MAMS pipeline ahead</div><div class="pair-value">' + money(D.pipeline.mams.weighted) + '</div><div class="pair-sub">' + D.pipeline.mams.deals + ' deals, weighted</div></div>';
    h += '</div>';
    if (D.pipeline.caveat) { h += '<p class="kicker" style="font-size:13px;font-style:normal;color:rgba(0,63,63,0.6)">' + esc(D.pipeline.caveat) + '</p>'; }
    h += '</section>';

    /* ENGINES */
    var e = D.engines;
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">Two engines</div><h2>One proven. One to <em>fund</em>.</h2><p class="engine-note">' + esc(e.note) + '</p></div>';
    h += '<div class="engines">';

    var m = e.mams;
    h += '<div class="engine mams">';
    h += '<div class="engine-tag">' + esc(m.tag) + '</div><h3 class="engine-name">' + esc(m.name) + '</h3>';
    h += '<p class="engine-oneliner">' + esc(m.oneLiner) + '</p>';
    h += '<div class="engine-headline"><span class="engine-headline-label">' + esc(m.headlineStat.label) + '</span><span class="engine-headline-value">' + money(m.headlineStat.value) + '</span><span class="engine-headline-sub">' + esc(m.headlineStat.sub) + '</span></div>';
    h += '<div class="metrics">';
    h += '<div class="metric"><span class="metric-label">Followers</span><span class="metric-value">' + m.content.followers.toLocaleString() + '</span></div>';
    h += '<div class="metric"><span class="metric-label">Grew by</span><span class="metric-value">+' + m.content.followersGained.toLocaleString() + '</span></div>';
    h += '<div class="metric"><span class="metric-label">Video views</span><span class="metric-value">' + compact(m.content.views) + '</span></div>';
    h += '<div class="metric"><span class="metric-label">Shares</span><span class="metric-value">' + m.content.shares.toLocaleString() + '</span></div>';
    h += '<div class="metric"><span class="metric-label">Ad spend (Meta)</span><span class="metric-value">' + money(m.ads.spend) + '</span></div>';
    h += '<div class="metric"><span class="metric-label">New leads</span><span class="metric-value">' + m.ads.leads + '</span></div>';
    h += '</div>';
    h += '<p class="engine-foot">Top video, "' + esc(m.content.topReel.label) + '," reached ' + m.content.topReel.reach.toLocaleString() + ' people and was shared ' + m.content.topReel.shares.toLocaleString() + ' times.</p>';
    h += '</div>';

    var a = e.ag;
    h += '<div class="engine ag">';
    h += '<div class="engine-tag">' + esc(a.tag) + '</div><h3 class="engine-name">' + esc(a.name) + '</h3>';
    h += '<p class="engine-oneliner">' + esc(a.oneLiner) + '</p>';
    h += '<div class="engine-headline"><span class="engine-headline-label">' + esc(a.headlineStat.label) + '</span><span class="engine-headline-value">' + money(a.headlineStat.value) + '</span><span class="engine-headline-sub">' + esc(a.headlineStat.sub) + '</span></div>';
    h += '<div class="metrics">';
    h += '<div class="metric"><span class="metric-label">Ad views</span><span class="metric-value">' + compact(a.ads.impressions) + '</span></div>';
    h += '<div class="metric"><span class="metric-label">Clicks</span><span class="metric-value">' + a.ads.clicks.toLocaleString() + '</span></div>';
    h += '<div class="metric"><span class="metric-label">Conversions</span><span class="metric-value">' + a.ads.conversions + '</span></div>';
    h += '<div class="metric"><span class="metric-label">New leads</span><span class="metric-value">' + a.ads.leads + '</span></div>';
    h += '</div>';
    h += '<p class="engine-foot">' + esc(a.foot || ('Every closed facilitation pays ' + a.feePerDeal + '. This is the lane the next $9,000 feeds.')) + '</p>';
    h += '</div>';

    h += '</div></section>';

    /* SPEND */
    var sp = D.spend;
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">Where it went</div><h2>Full transparency, <em>every dollar</em>.</h2><p class="section-lede">' + esc(sp.note) + '</p></div>';

    function spendBlock(title, block) {
      var out = '<div class="rows">';
      block.items.forEach(function (it) {
        var extra = (it.detail || it.note) ? '<span class="sub">' + esc(it.detail || it.note) + '</span>' : '';
        var val = it.amount === null ? '<span class="row-value pending">the balance</span>' : '<div class="row-value">' + (it.approx ? '~' : '') + money(it.amount) + '</div>';
        out += '<div class="row"><div class="row-label">' + esc(it.label) + extra + '</div>' + val + '</div>';
      });
      if (block.total !== undefined && block.total !== null) {
        out += '<div class="row row-total"><div class="row-label">' + esc(title) + '</div><div class="row-value">' + money(block.total) + '</div></div>';
      }
      out += '</div>';
      return out;
    }
    h += '<div class="eyebrow" style="margin-top:6px">AG Home Buyers, reinvested</div>' + spendBlock('AG reinvestment', sp.reinvestment.ag);
    h += '<div class="eyebrow">MAMS, reinvested</div>' + spendBlock('MAMS reinvestment', sp.reinvestment.mams);
    h += '<div class="eyebrow">How I have been living</div>' + spendBlock('', sp.lifestyle);
    h += '<p class="kicker">' + esc(sp.lifestyle.honestClose) + '</p>';
    h += '</section>';

    /* FORWARD: the plan, continued (scoreboard) */
    var f = D.forward;
    var dl = f.deal;
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">' + esc(f.eyebrow) + '</div><h2>' + esc(f.title) + '</h2></div>';
    h += '<div class="bignum-card">';
    h += '<div class="bignum-label">The deal you started</div>';
    h += '<div class="deal-legs">';
    h += '<div class="deal-leg"><span class="deal-leg-label">You put in</span><span class="deal-leg-val">' + money(dl.inTotal) + '</span><span class="deal-leg-sub">' + esc(dl.inStructure) + '</span></div>';
    h += '<div class="deal-becomes">becomes</div>';
    h += '<div class="deal-leg"><span class="deal-leg-label">You get back</span><span class="deal-leg-val gold">' + money(dl.backTotal) + '</span><span class="deal-leg-sub">' + esc(dl.backSub) + '</span></div>';
    h += '</div>';
    h += '<div class="deal-progress"><span><strong>In so far</strong> ' + money(dl.done) + '</span><span><strong>Remaining</strong> ' + money(dl.remaining) + '</span><span><strong>Next step</strong> ' + esc(dl.nextStep) + '</span></div>';
    h += '</div>';
    h += '<p class="kicker">' + esc(dl.backExplain) + '</p>';
    h += '<div class="plan"><div class="plan-top"><span class="plan-label">' + esc(f.useOfFunds.headline) + '</span></div><p class="plan-detail">' + esc(f.useOfFunds.detail) + '</p></div>';
    h += '</section>';

    /* ASK: the return, defined */
    var k = D.ask;
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">' + esc(k.eyebrow) + '</div><h2>' + esc(k.headline) + '</h2></div>';
    var rp = k.repayment;
    h += '<div class="plan"><div class="plan-top"><span class="plan-label">How the $32,000 comes back</span><span class="plan-amt">' + money(rp.perClose) + ' / close</span></div>';
    h += '<p class="plan-detail">' + esc(rp.rule) + ' ' + esc(rp.paceNote) + '</p>';
    h += '<p class="plan-detail" style="color:#B1922E">' + esc(rp.startsNote) + '</p></div>';
    h += '<div class="plan separate"><div class="plan-top"><span class="plan-label">' + esc(k.month3.headline) + '</span><span class="plan-amt">on milestone</span></div>';
    h += '<p class="plan-detail">' + esc(k.month3.rule) + ' ' + esc(k.month3.note) + '</p></div>';
    h += '<div class="honest-read"><div class="eyebrow">Not if. When.</div><ul class="ask-list">';
    k.proof.forEach(function (li) { h += '<li>' + esc(li) + '</li>'; });
    h += '</ul><p class="ask-close">' + esc(k.close) + '</p></div>';
    h += '</section>';

    /* FEEDBACK */
    h += '<section class="section">';
    h += '<div class="section-header"><div class="eyebrow">Your turn</div><h2>Tell me what you <em>think</em>.</h2><p class="section-lede">Push on anything. What is unclear, what you would want to see, what you would do differently. It comes straight to me.</p></div>';
    h += '<div class="feedback"><div class="eyebrow">A note for Miles</div><h2>Send it <em>straight</em>.</h2><p class="feedback-lede">Nothing too small, nothing too big. The honest read is the value.</p>';
    h += '<form class="feedback-form" id="feedback-form" onsubmit="return sendFeedback(event)"><textarea class="feedback-textarea" id="feedback-body" placeholder="What stands out, what is missing, what you would push on." required></textarea>';
    h += '<div class="feedback-actions"><button type="submit" class="feedback-send">Send to Miles</button><span class="feedback-note">Opens your mail app with this addressed to me. You hit send.</span></div>';
    h += '<div class="feedback-success" id="feedback-success">Mail draft is open. Hit send and I will see it. Whatever you say, I fold it back in and re-share.</div></form></div>';
    h += '</section>';

    /* FOOTER */
    h += '<div class="footer"><div class="signature">- Miles</div><div class="footer-note">' + esc(D.meta.updatedLabel) + ' · Built for Mom and Dad · Refreshes as the numbers move</div></div>';

    app.innerHTML = h;
  }

  function sendFeedback(ev) {
    ev.preventDefault();
    var body = document.getElementById('feedback-body').value.trim();
    if (!body) return false;
    var subject = 'The Money, Straight: a note from your read';
    var url = 'mailto:miles@milesagee.com?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(body + '\n\n---\nSent from the investor snapshot\nhttps://mamsnow.com/scaffold/intros/dashboards/snapshot-61a0746a28.html');
    window.location.href = url;
    document.getElementById('feedback-success').classList.add('visible');
    setTimeout(function () { document.getElementById('feedback-success').classList.remove('visible'); }, 12000);
    return false;
  }

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (res) { if (!res.ok) throw new Error('load'); return res.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('app').innerHTML = '<div class="loading">Open this from the link Miles sent so the numbers can load.</div>';
    });
</script>

</body>
</html>
